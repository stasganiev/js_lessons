<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="TE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <meta name="keywords" content="">
    <meta name="description" content="Testing form elements">

    <link href="./css/normolize.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
    <link rel="preload" href="./fonts/lekton-regular-webfont.woff2" as="font" crossorigin="anonymous">
    <link rel="preload" href="./fonts/lekton-regular-webfont.woff" as="font" crossorigin="anonymous">

    <link rel="shortcut icon" type="image/x-icon" href="./img/logo16.png">

</head>
<body>

  <!-- <header class="header">

  </header> -->

  <main class="main">

    <form class="myform" action="echo.ganiev.pro" method="post">

      <fieldset>

        <legend>Inputs</legend>
        <div class="firstname-wrap inputs-wrap">
          <label class="firstname-label label" for="fi_firstname">First name</label>
          <input class="firstname-input input" type="text" id="fi_firstname" name="firstname" value="" placeholder="ex: Andrey">
        </div>
        <div class="lastname-wrap inputs-wrap">
          <label class="lastname-label label" for="fi_lastname">Last name</label>
          <input class="lastname-input input" type="text" id="fi_lastname" name="lastname" value="" placeholder="ex: Ivanov">
        </div>
        <div class="email-wrap inputs-wrap">
          <label class="email-label label" for="fi_email">E-mail</label>
          <input class="email-input input" type="email" id="fi_email" name="email" value="" placeholder="ex: ivanov@gmail.com">
        </div>

        <div class="job-wrap inputs-wrap">
          <label class="job-label label" for="jobselect">Job</label>
          <select class="job-input input" name="job" id="jobselect">
            <optgroup label="Game dev">
              <option value="csharp">C#</option>
              <option value="cpp">C++</option>
              <option value="go">Go</option>
              <option value="pithon">Pithon</option>
            </optgroup>
            <optgroup label="Web dev">
              <option value="frontend" selected>Frontend</option>
              <option value="backend">Backend</option>
            </optgroup>
          </select>
        </div>

        <div class="ticket_type-wrap inputs-wrap">
          <p class="ticket_type-label label visually-hidden">Your generate</p>
          <div>
            <input type="radio" id="child" name="ticket_type" value="child">
            <label for="child">Child</label>
          </div>
          <div>
            <input type="radio" id="adult" name="ticket_type" value="adult" checked>
            <label for="adult">Adult</label>
          </div>
          <div>
            <input type="radio" id="senior" name="ticket_type" value="senior">
            <label for="senior">Senior</label>
          </div>
        </div>
        
        <div class="agree-wrap inputs-wrap">
          <div>
            <input type="checkbox" id="agree" name="agree_check" checked>
            <label for="agree">I agree</label>
          </div>
        </div>

        <div class="submit-wrap inputs-wrap">
          <button class="submit-btn btn" type="submit" alt="submit">
            Submit
            <img class="submit-img" src="./img/logo16.png">
          </button>
        </div>
        
      </fieldset>

    </form>

  </main>

  <!-- <footer class="footer">

  </footer> -->

  <script src="./js/script.js"></script>
  
</body>
</html>
