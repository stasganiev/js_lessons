<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./img/logo16.png" type="image/x-icon">
  <link href="./css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/fontello.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
  <title>Видео курс по Git и GitHub для 1С-ника</title>
</head>
<body>

  <header>
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h1 class="text-center text-white">Видео курс Git и GitHub в помощь 1С-нику</h1>
          <div class="itd_play" data-bs-toggle="modal" data-bs-target="#trailerModal">
            <div class="itd_triangle"></div>
          </div>
          <a href="#footer" class="btn btn-itd btn-lg text-uppercase">Начать обучение</a>
        </div>
      </div>
    </div>
  </header>

  <section class="about">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h2 class="text-center text-uppercase color1 mb-5">О курсе</h2>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-4 col-md-6 col-sm-12">
          <div class="itd_circle"><i class="icon-list-numbered"></i></div>
          <h5 class="text-center">Структурированный материал</h5>
          <div class="line"></div>
        </div>
        <div class="col-xl-4 col-md-6 col-sm-12">
          <div class="itd_circle"><i class="icon-rouble"></i></div>
          <h5 class="text-center">Доступная цена</h5>
          <div class="line"></div>
        </div>
        <div class="col-xl-4 col-md-6 col-sm-12">
          <div class="itd_circle"><i class="icon-chart-bar"></i></div>
          <h5 class="text-center">Актуальность</h5>
          <div class="line"></div>
        </div>
        <div class="col-xl-4 col-md-6 col-sm-12">
          <div class="itd_circle"><i class="icon-code"></i></div>
          <h5 class="text-center">Практические уроки и задания</h5>
          <div class="line"></div>
        </div>
        <div class="col-xl-4 col-md-6 col-sm-12">
          <div class="itd_circle"><i class="icon-file-video"></i></div>
          <h5 class="text-center">13 уроков (4 часа видео)</h5>
          <div class="line"></div>
        </div>
        <div class="col-xl-4 col-md-6 col-sm-12">
          <div class="itd_circle"><i class="icon-help"></i></div>
          <h5 class="text-center">Дополнительные полезные материалы</h5>
          <div class="line"></div>
        </div>
      </div>
    </div>
  </section>

  <footer id="footer">1</footer>

  <div class="modal fade" id="trailerModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class='embed-container'>
            <iframe src='https://youtu.be/W3LYFMY4Tz4?si=6jPKdOIeODYrlO-t' frameborder='0' allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <!-- My scripts -->

</body>
</html>
